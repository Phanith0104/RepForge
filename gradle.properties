# Increase the heap size for the Gradle daemon
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable parallel execution and build caching for better performance
org.gradle.parallel=true
org.gradle.caching=true

# Android-specific settings
android.useAndroidX=true
# Jetifier is disabled for better performance as modern libraries are AndroidX ready
android.enableJetifier=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
org.gradle.configuration-cache=true
